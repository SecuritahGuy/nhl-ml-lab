[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nhl-ml-lab"
version = "0.1.0"
description = "NHL ML/AI lab for predictions and website"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "httpx==0.27.0",
    "pydantic==2.7.0",
    "scikit-learn==1.5.2",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "black==24.10.0",
    "ruff==0.7.0",
    "mypy==1.10.0",
]

[tool.setuptools.packages.find]
where = ["app"]